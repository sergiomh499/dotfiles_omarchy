# NVIDIA PRIME render offload — iGPU drives the display, dGPU wakes on demand.
# To run a specific app on the dGPU prefix it with: prime-run <app>
# e.g: prime-run steam, prime-run blender, prime-run gamescope

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
